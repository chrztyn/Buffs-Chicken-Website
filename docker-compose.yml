services:
  backend:
    build: ./backend
    restart: always
    volumes:
      - backend_images:/app/backend-images
    expose:
      - '5001'
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    restart: always
    expose:
      - '3000'
    environment:
      - NITRO_HOST=0.0.0.0
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
