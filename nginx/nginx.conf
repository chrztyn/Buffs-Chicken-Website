events {}

http {
  server {
    listen 80;
    server_name buffschicken.com www.buffschicken.com;
    return 301 https://buffschicken.com$request_uri;
  }

  server {
    listen 443 ssl;
    server_name www.buffschicken.com;
    ssl_certificate /etc/letsencrypt/live/buffschicken.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buffschicken.com/privkey.pem;
    return 301 https://buffschicken.com$request_uri;
  }

  server {
    listen 443 ssl;
    server_name buffschicken.com;

    ssl_certificate /etc/letsencrypt/live/buffschicken.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buffschicken.com/privkey.pem;

    client_max_body_size 20M;

    location /api/ {
      proxy_pass http://backend:5001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /socket.io/ {
      proxy_pass http://backend:5001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location /backend-images/ {
      proxy_pass http://backend:5001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      proxy_pass http://frontend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}